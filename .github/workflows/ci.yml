name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devops_app
          POSTGRES_USER: devops_user
          POSTGRES_PASSWORD: devops_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops_user -d devops_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://devops_user:devops_test_password@localhost:5432/devops_app
          SECRET_KEY: ci-test-secret
        run: |
          flask --app "app:create_app" db upgrade

      - name: Run tests
        env:
          DATABASE_URL: postgresql://devops_user:devops_test_password@localhost:5432/devops_app
          SECRET_KEY: ci-test-secret
        run: |
          pytest -v
