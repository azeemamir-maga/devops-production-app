services:

  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: devops_app
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: azim789654
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
