services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: devops_app
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: azim789654
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://devops_user:azim789654@db:5432/devops_app
      SECRET_KEY: devops-production-secret
    depends_on:
      - db
    expose:
      - "5000"
    volumes:
      - .:/app

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
